  }

  .skill-number {
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--color-accent-text);
    font-weight: 600;
    margin-bottom: 16px;
    display: block;
  }

  .skill-title {
    font-family: var(--font-serif);
    font-size: 24px;
    margin-bottom: 12px;
  }

  .skill-description {
    color: var(--color-text-secondary);
  }

  @media (max-width: 760px) {
    .skills-grid { grid-template-columns: 1fr; gap: 40px; }
  }

  /* ===========================================================
     CONTACT
     =========================================================== */
  .contact-heading {
    font-size: clamp(36px, 5vw, 56px);
    margin-bottom: 24px;
  }

  .contact-description {
    max-width: 50ch;
    color: var(--color-text-secondary);
    margin-bottom: 40px;
    font-size: 18px;
  }

  .contact-links {
    display: flex;
    flex-wrap: wrap;
    gap: 16px 40px;
  }

  .contact-links a {
    font-family: var(--font-serif);
    font-size: 22px;
    border-bottom: 1px solid transparent;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  .contact-links a:hover {
    color: var(--color-accent-text);
    border-color: var(--color-accent-text);
  }

  /* ===========================================================
     FOOTER
     =========================================================== */
  .site-footer {
    border-top: 1px solid var(--color-border);
    padding: 56px 0;
  }

  .footer-grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr 1fr;
    gap: 32px;
  }

  .footer-name {
    font-family: var(--font-serif);
    font-size: 20px;
    margin-bottom: 12px;
  }

  .footer-description {
    color: var(--color-text-secondary);
    max-width: 32ch;
  }

  .footer-heading {
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-text-secondary);
    margin-bottom: 16px;
  }

  .footer-links {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .footer-links a {
    color: var(--color-text-secondary);
    transition: color 0.2s ease;
  }
  .footer-links a:hover { color: var(--color-text); }

  .footer-bottom {
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--color-border);
    font-size: 13px;
    color: var(--color-text-secondary);
  }

  @media (max-width: 640px) {
    .footer-grid { grid-template-columns: 1fr; gap: 32px; }
  }

  /* ===========================================================
     ACCESSIBILITY HELPERS
     =========================================================== */
  .skip-link {
    position: absolute;
    left: -9999px;
    top: 0;
    background: var(--color-text);
    color: var(--color-bg);
    padding: 12px 20px;
    z-index: 1000;
  }
  .skip-link:focus {
    left: 16px;
    top: 16px;
  }

  a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--color-accent-text);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<!-- ===========================================================
     STRUCTURE — generally you shouldn't need to edit markup
     below, just the SITE object above. Everything text-based is
     rendered dynamically via renderSite() at the bottom of the
     page.
     =========================================================== -->

<header class="site-header">
  <div class="container">
    <a href="#top" class="logo" id="logo"></a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="siteNav">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <nav class="site-nav" id="siteNav" aria-label="Primary"></nav>
  </div>
</header>

<main id="main">

  <section class="hero" id="top">
    <div class="container">
      <div>
        <span class="section-label" id="heroLabel"></span>
        <h1 class="hero-heading" id="heroHeading"></h1>
        <p class="hero-role" id="heroRole"></p>
        <p class="hero-pitch" id="heroPitch"></p>
        <div class="hero-ctas" id="heroCtas"></div>
      </div>
      <img class="hero-photo" id="heroPhoto" alt="" width="800" height="1067" fetchpriority="high">
    </div>
  </section>

  <section id="about" class="fade-in">
    <div class="container">
      <span class="section-label" id="aboutLabel"></span>
      <h2 class="about-heading" id="aboutHeading"></h2>
      <div class="about-body" id="aboutBody"></div>
    </div>
  </section>

  <section id="experience" class="alt-bg fade-in">
    <div class="container">
      <span class="section-label" id="experienceLabel"></span>
      <h2 class="section-heading" id="experienceHeading"></h2>
      <div class="experience-list" id="experienceList"></div>
    </div>
  </section>

  <section id="projects" class="fade-in">
    <div class="container">
      <span class="section-label" id="projectsLabel"></span>
      <h2 class="section-heading" id="projectsHeading"></h2>
      <div class="project-grid" id="projectGrid"></div>
    </div>
  </section>

  <section id="skills" class="alt-bg fade-in">
    <div class="container">
      <span class="section-label" id="skillsLabel"></span>
      <h2 class="section-heading" id="skillsHeading"></h2>
      <div class="skills-grid" id="skillsGrid"></div>
    </div>
  </section>

  <section id="contact" class="fade-in">
    <div class="container">
      <span class="section-label" id="contactLabel"></span>
      <h2 class="contact-heading" id="contactHeading"></h2>
      <p class="contact-description" id="contactDescription"></p>
      <div class="contact-links" id="contactLinks"></div>
    </div>
  </section>

</main>

<!-- Project detail view: shown instead of #main when the URL is #/project/<slug> -->
<main id="detailMain" hidden>
  <div class="container detail" id="detailContent"></div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div>
        <div class="footer-name" id="footerName"></div>
        <p class="footer-description" id="footerDescription"></p>
      </div>
      <div>
        <div class="footer-heading">Navigation</div>
        <ul class="footer-links" id="footerNav"></ul>
      </div>
      <div>
        <div class="footer-heading">Connect</div>
        <ul class="footer-links" id="footerConnect"></ul>
      </div>
    </div>
    <div class="footer-bottom" id="footerBottom"></div>
  </div>
</footer>

<script>
  (function renderSite() {
    var S = window.SITE;

    function el(tag, opts) {
      opts = opts || {};
      var node = document.createElement(tag);
      if (opts.class) node.className = opts.class;
      if (opts.text) node.textContent = opts.text;
      if (opts.html) node.innerHTML = opts.html;
      if (opts.attrs) {
        for (var k in opts.attrs) node.setAttribute(k, opts.attrs[k]);
      }
      return node;
    }

    // --- Header / nav ---
    document.getElementById("logo").textContent = S.name;
    document.title = S.name + " — " + S.role;

    var navEl = document.getElementById("siteNav");
    S.nav.forEach(function (item) {
      var a = el("a", { text: item.label, attrs: { href: item.href } });
      navEl.appendChild(a);
    });

    var footerNavEl = document.getElementById("footerNav");
    S.nav.forEach(function (item) {
      var li = el("li");
      li.appendChild(el("a", { text: item.label, attrs: { href: item.href } }));
      footerNavEl.appendChild(li);
    });

    // --- Hero ---
    document.getElementById("heroLabel").textContent = S.hero.label;
    document.getElementById("heroHeading").textContent = S.hero.heading;
    document.getElementById("heroRole").textContent = S.hero.subheading;
    document.getElementById("heroPitch").textContent = S.hero.pitch;
    var heroPhoto = document.getElementById("heroPhoto");
    heroPhoto.src = S.hero.photo;
    heroPhoto.alt = S.hero.photoAlt;

    var ctas = document.getElementById("heroCtas");
    ctas.appendChild(el("a", {
      class: "btn btn-primary",
      text: S.hero.ctaPrimary.label,
      attrs: { href: S.hero.ctaPrimary.href }
    }));
    ctas.appendChild(el("a", {
      class: "btn btn-link",
      text: S.hero.ctaSecondary.label,
      attrs: { href: S.hero.ctaSecondary.href }
    }));

    // --- About ---
    document.getElementById("aboutLabel").textContent = S.about.label;
    document.getElementById("aboutHeading").textContent = S.about.heading;
    var aboutBody = document.getElementById("aboutBody");
    S.about.paragraphs.forEach(function (text) {
      aboutBody.appendChild(el("p", { text: text }));
    });

    // --- Experience ---
    document.getElementById("experienceLabel").textContent = S.experience.label;
    document.getElementById("experienceHeading").textContent = S.experience.heading;
    var expList = document.getElementById("experienceList");
    S.experience.items.forEach(function (item) {
      var row = el("div", { class: "experience-item" });
      row.appendChild(el("div", { class: "experience-period", text: item.period }));
      var right = el("div");
      right.appendChild(el("h3", { class: "experience-role", text: item.role }));
      right.appendChild(el("div", { class: "experience-company", text: item.company }));
      right.appendChild(el("p", { class: "experience-description", text: item.description }));
      row.appendChild(right);
      expList.appendChild(row);
    });

    // --- Projects ---
    document.getElementById("projectsLabel").textContent = S.projects.label;
    document.getElementById("projectsHeading").textContent = S.projects.heading;
    var grid = document.getElementById("projectGrid");
    function phoneFrame(src, alt) {
      var frame = el("div", { class: "project-frame" });
      if (src) {
        frame.appendChild(el("img", { attrs: { src: src, alt: alt, loading: "lazy" } }));
      } else {
        frame.appendChild(el("div", { class: "project-frame-placeholder", text: "Screenshot placeholder" }));
      }
      return frame;
    }

    S.projects.items.forEach(function (item) {
      var card = el("a", { class: "project-card", attrs: { href: "#/project/" + item.slug } });
      card.appendChild(phoneFrame(item.image, item.title + " screenshot"));
      card.appendChild(el("h3", { class: "project-title", text: item.title }));
      card.appendChild(el("div", { class: "project-meta", text: item.meta }));
      card.appendChild(el("p", { class: "project-description", text: item.description }));
      card.appendChild(el("span", { class: "project-cta", html: "View details <span aria-hidden=\"true\">→</span>" }));
      grid.appendChild(card);
    });

    // --- Project detail view (hash router: #/project/<slug>) ---
    var homeEl = document.getElementById("main");
    var detailEl = document.getElementById("detailMain");
    var detailContent = document.getElementById("detailContent");
    var D = S.projects.detail;
    var homeTitle = S.name + " — " + S.role;

    function metaBlock(label, valueNode) {
      var wrap = el("div");
      wrap.appendChild(el("span", { class: "section-label", text: label }));
      wrap.appendChild(valueNode);
      return wrap;
    }

    function textBlock(label, text) {
      var wrap = el("div", { class: "detail-block" });
      wrap.appendChild(el("span", { class: "section-label", text: label }));
      wrap.appendChild(el("p", { text: text }));
      return wrap;
    }

    function renderProject(index) {
      var p = S.projects.items[index];
      var next = S.projects.items[(index + 1) % S.projects.items.length];
      detailContent.textContent = "";

      var back = el("a", { class: "back-link", attrs: { href: "#projects" } });
      back.innerHTML = "<span aria-hidden=\"true\">←</span> ";
      back.appendChild(document.createTextNode(D.backLabel));
      detailContent.appendChild(back);

      var layout = el("div", { class: "detail-layout" });

      var main = el("div");
      main.appendChild(el("span", { class: "section-label", text: p.meta }));
      main.appendChild(el("h1", { class: "detail-title", text: p.title, attrs: { id: "detailTitle", tabindex: "-1" } }));
      main.appendChild(el("p", { class: "detail-lead", text: p.overview }));

      var playLink = p.links && p.links.find(function (l) { return l.href.indexOf("play.google.com") >= 0; });
      if (playLink) {
        var badge = el("a", { class: "play-badge", attrs: { href: playLink.href, target: "_blank", rel: "noopener" } });
        if (p.icon) badge.appendChild(el("img", { class: "play-badge-icon", attrs: { src: p.icon, alt: "", loading: "lazy", width: "48", height: "48" } }));
        var badgeText = el("span", { class: "play-badge-text" });
        badgeText.appendChild(el("span", { class: "play-badge-eyebrow", text: D.getItOnGooglePlay }));
        badgeText.appendChild(el("span", { class: "play-badge-label", text: playLink.label + " ↗" }));
        badge.appendChild(badgeText);
        main.appendChild(badge);
      }

      if (p.audience) main.appendChild(textBlock(D.audienceLabel, p.audience));
      if (p.benefits) main.appendChild(textBlock(D.benefitsLabel, p.benefits));
      main.appendChild(textBlock(D.challengeLabel, p.challenge));
      main.appendChild(textBlock(D.solutionLabel, p.solution));
      if (p.highlights && p.highlights.length) {
        var hl = el("div", { class: "detail-block" });
        hl.appendChild(el("span", { class: "section-label", text: D.highlightsLabel }));
        var ul = el("ul", { class: "detail-highlights" });
        p.highlights.forEach(function (h) { ul.appendChild(el("li", { text: h })); });
        hl.appendChild(ul);
        main.appendChild(hl);
      }
      layout.appendChild(main);

      var meta = el("aside", { class: "detail-meta", attrs: { "aria-label": "Project details" } });
      meta.appendChild(metaBlock(D.roleLabel, el("div", { class: "detail-meta-value", text: p.role })));
      meta.appendChild(metaBlock(D.yearLabel, el("div", { class: "detail-meta-value", text: p.year })));
      if (p.stack && p.stack.length) {
        var stackList = el("ul");
        p.stack.forEach(function (s) { stackList.appendChild(el("li", { text: s })); });
        meta.appendChild(metaBlock(D.stackLabel, stackList));
      }
      var sidebarLinks = p.links ? p.links.filter(function (l) { return l !== playLink; }) : [];
      if (sidebarLinks.length) {
        var linkList = el("ul");
        sidebarLinks.forEach(function (l) {
          var li = el("li");
          li.appendChild(el("a", { text: l.label + " ↗", attrs: { href: l.href, target: "_blank", rel: "noopener" } }));
          linkList.appendChild(li);
        });
        meta.appendChild(metaBlock(D.linksLabel, linkList));
      }
      layout.appendChild(meta);
      detailContent.appendChild(layout);

      if (p.screenshots && p.screenshots.length) {
        var screens = el("div", { class: "detail-screens" });
        screens.appendChild(el("span", { class: "section-label", text: D.screenshotsLabel }));
        var sGrid = el("div", { class: "detail-screens-grid" });
        p.screenshots.forEach(function (src, i) {
          sGrid.appendChild(phoneFrame(src, p.title + " screenshot " + (i + 1)));
        });
        screens.appendChild(sGrid);
        detailContent.appendChild(screens);
      }

      if (next !== p) {
        var nextLink = el("a", { class: "detail-next", attrs: { href: "#/project/" + next.slug } });
        var nextText = el("div");
        nextText.appendChild(el("span", { class: "section-label", text: D.nextLabel }));
        nextText.appendChild(el("div", { class: "detail-next-title", text: next.title }));
        nextLink.appendChild(nextText);
        nextLink.appendChild(el("span", { class: "detail-next-arrow", html: "→", attrs: { "aria-hidden": "true" } }));
        detailContent.appendChild(nextLink);
      }

      document.title = p.title + " — " + S.name;
    }

    var currentView = "home";

    function route() {
      var match = location.hash.match(/^#\/project\/([\w-]+)$/);
      var index = -1;
      if (match) {
        S.projects.items.forEach(function (p, i) { if (p.slug === match[1]) index = i; });
      }

      if (index >= 0) {
        renderProject(index);
        homeEl.hidden = true;
        detailEl.hidden = false;
        currentView = "detail";
        navEl.querySelectorAll("a").forEach(function (a) { a.classList.remove("active"); });
        window.scrollTo({ top: 0, behavior: "instant" });
        document.getElementById("detailTitle").focus({ preventScroll: true });
      } else {
        var wasDetail = currentView === "detail";
        detailEl.hidden = true;
        homeEl.hidden = false;
        currentView = "home";
        document.title = homeTitle;
        if (wasDetail) {
          var target = location.hash.length > 1 ? document.getElementById(location.hash.slice(1)) : null;
          if (target) target.scrollIntoView();
          else window.scrollTo({ top: 0, behavior: "instant" });
        }
      }
    }

    window.addEventListener("hashchange", route);
    route();

    // --- Skills ---
    document.getElementById("skillsLabel").textContent = S.skills.label;
    document.getElementById("skillsHeading").textContent = S.skills.heading;
    var skillsGrid = document.getElementById("skillsGrid");
    S.skills.groups.forEach(function (group) {
      var col = el("div");
      col.appendChild(el("span", { class: "skill-number", text: group.number }));
      col.appendChild(el("h3", { class: "skill-title", text: group.title }));
      col.appendChild(el("p", { class: "skill-description", text: group.description }));
      skillsGrid.appendChild(col);
    });

    // --- Contact ---
    document.getElementById("contactLabel").textContent = S.contact.label;
    document.getElementById("contactHeading").textContent = S.contact.heading;
    document.getElementById("contactDescription").textContent = S.contact.description;
    var contactLinks = document.getElementById("contactLinks");
    contactLinks.appendChild(el("a", { text: S.contact.email, attrs: { href: "mailto:" + S.contact.email } }));
    contactLinks.appendChild(el("a", { text: "GitHub", attrs: { href: S.contact.github, target: "_blank", rel: "noopener" } }));
    contactLinks.appendChild(el("a", { text: "LinkedIn", attrs: { href: S.contact.linkedin, target: "_blank", rel: "noopener" } }));

    // --- Footer ---
    document.getElementById("footerName").textContent = S.name;
    document.getElementById("footerDescription").textContent = S.footer.description;
    var footerConnect = document.getElementById("footerConnect");
    [
      { label: "Email", href: "mailto:" + S.contact.email },
      { label: "GitHub", href: S.contact.github },
      { label: "LinkedIn", href: S.contact.linkedin }
    ].forEach(function (item) {
      var li = el("li");
      li.appendChild(el("a", { text: item.label, attrs: { href: item.href, target: item.href.indexOf("http") === 0 ? "_blank" : "_self", rel: "noopener" } }));
      footerConnect.appendChild(li);
    });
    document.getElementById("footerBottom").textContent = "© " + new Date().getFullYear() + " " + S.name + ". All rights reserved.";

    // --- Mobile nav toggle ---
    var toggle = document.getElementById("navToggle");
    toggle.addEventListener("click", function () {
      var isOpen = navEl.classList.toggle("is-open");
      toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });
    navEl.querySelectorAll("a").forEach(function (link) {
      link.addEventListener("click", function () {
        navEl.classList.remove("is-open");
        toggle.setAttribute("aria-expanded", "false");
      });
    });

    // --- Active section highlighting via IntersectionObserver ---
    var navLinks = Array.prototype.slice.call(navEl.querySelectorAll("a"));
    var sections = S.nav
      .map(function (item) { return document.querySelector(item.href); })
      .filter(Boolean);
    sections.push(document.getElementById("top"));

    if ("IntersectionObserver" in window && sections.length) {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            var id = "#" + entry.target.id;
            navLinks.forEach(function (link) {
              link.classList.toggle("active", link.getAttribute("href") === id);
            });
          }
        });
      }, { rootMargin: "-40% 0px -50% 0px", threshold: 0 });

      sections.forEach(function (section) { observer.observe(section); });
    }

    // --- Fade-in on scroll ---
    var fadeEls = document.querySelectorAll(".fade-in");
    if ("IntersectionObserver" in window && fadeEls.length) {
      var fadeObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            fadeObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });
      fadeEls.forEach(function (elm) { fadeObserver.observe(elm); });
    } else {
      fadeEls.forEach(function (elm) { elm.classList.add("is-visible"); });
    }
  })();
</script>

</body>
</html>
